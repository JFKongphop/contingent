[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.26"          # satisfies CoFHE (>=0.8.25), v4 PoolManager (=0.8.26), BaseHook (^0.8.24)
auto_detect_remappings = false
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
code_size_limit = 300000         # CoFHE mocks + multi-scenario e2e test contracts exceed EIP-170
ffi = true
fs_permissions = [{access = "read-write", path = "./"}]

[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[profile.default.fuzz]
runs = 256
